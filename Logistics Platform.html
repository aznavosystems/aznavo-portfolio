argin:20px 0}.login-card-wrap{display:grid;place-items:center;padding:30px}.login-card{width:min(430px,100%);padding:30px}.login-card h2{font-size:26px}.login-card .field{margin-bottom:15px}.login-card button{width:100%;margin-top:8px}.toast{position:fixed;right:25px;bottom:25px;background:#101d33;border:1px solid rgba(59,130,246,.35);padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:30}.ai-float{position:fixed;right:25px;bottom:25px;width:56px;height:56px;border-radius:17px;border:0;background:linear-gradient(135deg,#7c3aed,#9f67ff);color:#fff;font-size:23px;box-shadow:0 18px 40px rgba(139,92,246,.42)}.hero-map{height:290px;position:relative;background:radial-gradient(circle at 50% 50%,rgba(47,124,255,.09),transparent 55%),linear-gradient(180deg,#071122,#091528)}.route{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#4b90ff,transparent);transform-origin:left center;opacity:.75}.route:after{content:'';position:absolute;right:0;top:-3px;width:8px;height:8px;border-radius:50%;background:#77b1ff;box-shadow:0 0 18px #2f7cff}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:1050px){.kpis,.three,.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{width:230px}}@media(max-width:760px){.sidebar{position:fixed;left:-270px;z-index:10}.content{padding:18px}.kpis,.three,.cards,.form-grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-art{display:none}.topbar{padding:0 14px}.page-head{align-items:flex-start;flex-direction:column}}

.profile{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.avatar{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#8b5cf6);font-weight:800}
.full{grid-column:1/-1}.field small{display:block;color:#667b96;margin-top:6px;font-size:11px}
.upload-zone{border:1px dashed rgba(104,165,255,.45);border-radius:14px;padding:22px;text-align:center;background:rgba(47,124,255,.05)}
.upload-zone input{margin-top:12px}.ai-answer{margin-top:14px;padding:14px;border-radius:13px;background:rgba(139,92,246,.09);border:1px solid rgba(139,92,246,.24);line-height:1.6}

.command-layout{display:grid;grid-template-columns:1.45fr .55fr;gap:16px}
.stat-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}

.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filter-row select,.filter-row input{background:#071122;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:#fff}
.timeline{padding:18px}.timeline-step{display:flex;gap:12px;position:relative;padding-bottom:20px}.timeline-step:before{content:'';position:absolute;left:6px;top:14px;bottom:0;width:1px;background:rgba(104,165,255,.28)}.timeline-step:last-child:before{display:none}.timeline-step .dot{flex:0 0 auto}

.auto-fill-box{padding:14px;border-radius:13px;background:rgba(47,124,255,.07);border:1px solid rgba(47,124,255,.25);margin-bottom:15px}
.loading-line{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
.loading-line span{display:block;height:100%;width:45%;background:linear-gradient(90deg,#2563eb,#8b5cf6);animation:scan 1s infinite alternate}
@keyframes scan{from{transform:translateX(-30%)}to{transform:translateX(160%)}}


.mobile-menu-btn{display:none}
.mobile-overlay{display:none}
.supply-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.supply-kpi{padding:16px}.supply-kpi b{display:block;font-size:23px;margin-top:8px}
.tracking-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.shipment-card{padding:18px}
.shipment-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.shipment-progress{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:22px 0 12px}

.shipment-step.done:before{background:var(--green)}
.shipment-step.current:before{background:var(--amber)}
.shipment-step span{font-size:10px;color:var(--muted)}
.compare-table td.best{background:rgba(34,197,94,.08);color:#9ff0b8;font-weight:700}

.phone-bottom-nav{display:none}

  .topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px;gap:9px}
  .topbar>strong{flex:1;font-size:14px}

  .top-actions{margin-left:0}

  .content{padding:14px}
  .page-head h1{font-size:23px}

  .page-head button,.panel-actions button{flex:1}
  .supply-kpis{grid-template-columns:repeat(2,1fr)}
  .tracking-grid{grid-template-columns:1fr}
  .shipment-progress{grid-template-columns:1fr;gap:8px}
  .shipment-step{text-align:left;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
  .shipment-step:before{width:12px;height:12px;margin:0;border-radius:50%}

  .modal-body{padding:15px}.modal-head,.modal-foot{padding:14px}

  .phone-bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:64px;background:rgba(5,11,24,.96);border-top:1px solid var(--line);z-index:8;backdrop-filter:blur(18px)}

.customer-hero{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:22px}
.customer-avatar{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#8b5cf6);font-weight:800;font-size:20px}
.customer-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.customer-kpi{padding:16px}.customer-kpi b{display:block;font-size:23px;margin-top:7px}
.customer-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:16px}

.email-item:hover,.email-item.active{background:rgba(47,124,255,.07)}

.integration-status{position:absolute;right:16px;top:16px}

.integration-log:last-child{border-bottom:0}

/* Premium icons and motion */
html{scroll-behavior:smooth}
button,.card,.nav-btn,input,select,textarea{
  transition:transform .22s cubic-bezier(.22,.8,.22,1),box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
button:active{transform:scale(.97)}
.primary:hover{transform:translateY(-2px);box-shadow:0 17px 34px rgba(37,99,235,.38)}
.secondary:hover,.icon-btn:hover{transform:translateY(-1px);border-color:rgba(104,165,255,.38);background:rgba(255,255,255,.07)}
.card{animation:cardEnter .48s cubic-bezier(.22,.8,.22,1) both}
.card:hover{transform:translateY(-3px);border-color:rgba(104,165,255,.27);box-shadow:0 26px 72px rgba(0,0,0,.38)}
.content>*{animation:pageEnter .42s cubic-bezier(.22,.8,.22,1) both}
.content>*:nth-child(2){animation-delay:.04s}
.content>*:nth-child(3){animation-delay:.08s}
.content>*:nth-child(4){animation-delay:.12s}
.modal{animation:fadeIn .2s ease both}
.modal-box{animation:modalEnter .3s cubic-bezier(.22,.8,.22,1) both}
.toast{animation:toastEnter .32s cubic-bezier(.22,.8,.22,1) both}
.bar span{transform-origin:left;animation:barEnter .8s cubic-bezier(.22,.8,.22,1) both}
.ai-float{animation:floatButton 2.8s ease-in-out infinite}
.nav-btn{position:relative;overflow:hidden}
.nav-btn:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(104,165,255,.08),transparent);transform:translateX(-120%);transition:transform .5s ease}
.nav-btn:hover:before{transform:translateX(120%)}
.nav-icon{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:8px;background:rgba(47,124,255,.08);color:#8fbdff;font-size:13px}
.nav-btn.active .nav-icon{background:rgba(47,124,255,.22);color:#fff;box-shadow:0 6px 16px rgba(47,124,255,.18)}
.nav-btn.active{box-shadow:inset 3px 0 0 #4f8cff}

/* Animated premium login */
.login{position:relative;overflow:hidden}
.login:before,.login:after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.login:before{width:460px;height:460px;left:-150px;top:-160px;background:radial-gradient(circle,rgba(47,124,255,.25),transparent 68%);animation:orbMove 8s ease-in-out infinite alternate}
.login:after{width:420px;height:420px;right:-120px;bottom:-150px;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 68%);animation:orbMove 10s ease-in-out infinite alternate-reverse}
.login-art,.login-card-wrap{position:relative;z-index:1}
.login-art{animation:loginLeft .65s cubic-bezier(.22,.8,.22,1) both}
.login-card{animation:loginRight .68s cubic-bezier(.22,.8,.22,1) .08s both;background:linear-gradient(180deg,rgba(16,29,51,.95),rgba(8,18,35,.96));backdrop-filter:blur(18px)}
.login-features{display:grid;gap:11px;margin-top:25px}
.login-feature{display:flex;align-items:center;gap:11px;color:#b9c7d8;font-size:14px}
.login-feature span{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:rgba(47,124,255,.12);color:#8ebcff}
.login-demo-note{margin-top:17px;padding:12px;border-radius:12px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);color:#9be7b2;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{outline:none;border-color:#4f8cff;box-shadow:0 0 0 4px rgba(47,124,255,.1)}

@keyframes pageEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cardEnter{from{opacity:0;transform:translateY(15px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalEnter{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastEnter{from{opacity:0;transform:translate(18px,12px)}to{opacity:1;transform:none}}
@keyframes barEnter{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes floatButton{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbMove{from{transform:translate3d(0,0,0)}to{transform:translate3d(50px,32px,0)}}
@keyframes loginLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes loginRight{from{opacity:0;transform:translateX(30px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== Global modal scroll fix ===== */
.modal{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-y:auto;
  overflow-x:hidden;
  background:rgba(1,6,16,.76);
  backdrop-filter:blur(8px);
}

.modal-box,
.modal-box.large,
.modal-box.small{
  width:min(980px,96vw);
  max-height:90vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:22px;
}

.modal-box.large{
  width:min(1120px,96vw);
}

.modal-box.small{
  width:min(520px,96vw);
}

.modal-head{
  flex:0 0 auto;
  position:sticky;
  top:0;
  z-index:2;
  background:#0b162a;
}

.modal-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:22px;
}

.modal-foot{
  flex:0 0 auto;
  position:sticky;
  bottom:0;
  z-index:2;
  background:#0b162a;
  border-top:1px solid var(--line);
}

/* Premium scrollbar */
.modal-body{
  scrollbar-width:thin;
  scrollbar-color:#3b82f6 transparent;
}

.modal-body::-webkit-scrollbar{
  width:8px;
}

.modal-body::-webkit-scrollbar-track{
  background:transparent;
}

.modal-body::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#3b82f6,#8b5cf6);
  border-radius:999px;
}

.modal-body::-webkit-scrollbar-thumb:hover{
  background:#60a5fa;
}

/* Keep long forms usable */
.modal-body .form-grid{
  align-items:start;
}

.modal-body textarea{
  min-height:110px;
  resize:vertical;
}

@media(max-width:760px){

function calculateOrderTotal(){
  const num=id=>{
    const raw=(document.getElementById(id)?.value||'').replace(/\s/g,'').replace(',','.');
    return Number(raw)||0;
  };
  const subtotal=num('f_subtotal');
  const transport=num('f_transport_cost');
  const customs=num('f_customs_cost');
  const insurance=num('f_insurance_cost');
  const other=num('f_other_cost');
  const total=subtotal+transport+customs+insurance+other;
  const currency=document.getElementById('f_order_currency')?.value||'EUR';
  setFieldValue('f_total',total.toLocaleString('fr-FR')+' '+currency);
  const deposit=num('f_deposit_paid');
  setFieldValue('f_remaining',Math.max(total-deposit,0).toLocaleString('fr-FR')+' '+currency);
}

function formatMarketMoneyFromEUR(eurValue){
  const market=AZ_MARKETS[state.market] || AZ_MARKETS.TN;
  const converted=Number(eurValue)*market.rate;
  return converted.toLocaleString(market.locale,{
    maximumFractionDigits:0,
    minimumFractionDigits:0
  })+' '+market.code;
}

function convertVisibleEuroAmounts(){
  const rootNode=document.querySelector('.app') || document.body;
  if(!rootNode) return;
  const walker=document.createTreeWalker(rootNode,NodeFilter.SHOW_TEXT);
  const nodes=[];
  let node;
  while(node=walker.nextNode()) nodes.push(node);

  nodes.forEach(n=>{
    const raw=n.nodeValue;
    if(!raw || !/[€]/.test(raw)) return;

    n.nodeValue=raw
      .replace(/(\d[\d\s.,]*)\s*K€/g,(m,num)=>{
        const clean=Number(num.replace(/\s/g,'').replace(',','.'));
        return Number.isFinite(clean)?formatMarketMoneyFromEUR(clean*1000):m;
      })
      .replace(/(\d[\d\s.,]*)\s*€/g,(m,num)=>{
        const clean=Number(num.replace(/\s/g,'').replace(',','.'));
        return Number.isFinite(clean)?formatMarketMoneyFromEUR(clean):m;
      });
  });
}

function applyFinalLanguage(){
  document.documentElement.lang=state.lang;
  if(state.lang!=='en') return;

  const rootNode=document.querySelector('.app') || document.body;
  const walker=document.createTreeWalker(rootNode,NodeFilter.SHOW_TEXT);
  const nodes=[];
  let node;
  while(node=walker.nextNode()) nodes.push(node);

  nodes.forEach(n=>{
    const raw=n.nodeValue;
    if(!raw || !raw.trim()) return;
    let updated=raw;
    Object.entries(AZ_TRANSLATIONS)
      .sort((a,b)=>b[0].length-a[0].length)
      .forEach(([fr,en])=>{ updated=updated.split(fr).join(en); });
    n.nodeValue=updated;
  });

  document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{
    const p=el.getAttribute('placeholder')||'';
    const placeholders={
      'Rechercher une commande, un client, un document…':'Search an order, customer or document…',
      'Rechercher un article':'Search an item',
      'Décrivez l’élément, l’action ou le workflow…':'Describe the item, action or workflow…'
    };
    if(placeholders[p]) el.setAttribute('placeholder',placeholders[p]);
  });
}

  localStorage.setItem('az_device_mode',mode);
  document.body.classList.remove('device-tablet','device-phone');
  if(mode==='tablet')document.body.classList.add('device-tablet');
  if(mode==='phone')document.body.classList.add('device-phone');
  ensureDeviceSwitcher();
  toast(state.lang==='fr'?`Mode ${mode==='desktop'?'ordinateur':mode==='tablet'?'tablette':'téléphone'}`:`${mode} mode`);
}
function ensureDeviceSwitcher(){
  document.querySelector('.dashboard-banner')?.remove();
  document.querySelectorAll('.device-switcher').forEach((el,i)=>{if(i>0)el.remove()});
  let box=document.querySelector('.device-switcher');
  if(!box){
    box=document.createElement('div');
    box.className='device-switcher';
    document.body.appendChild(box);
  }
  box.innerHTML=`
    <button class="${state.deviceMode==='desktop'?'active':''}" onclick="setDeviceMode('desktop')" title="Desktop">🖥️ <span>PC</span></button>
    <button class="${state.deviceMode==='tablet'?'active':''}" onclick="setDeviceMode('tablet')" title="Tablet">▣ <span>Tablet</span></button>
    <button class="${state.deviceMode==='phone'?'active':''}" onclick="setDeviceMode('phone')" title="Phone">▯ <span>Phone</span></button>`;
  document.body.classList.remove('device-tablet','device-phone');
  if(state.deviceMode==='tablet')document.body.classList.add('device-tablet');
  if(state.deviceMode==='phone')document.body.classList.add('device-phone');
}
const __renderDevicePreview=render;
render=function(){
  __renderDevicePreview();
  requestAnimationFrame(()=>{
    document.querySelector('.dashboard-banner')?.remove();
    ensureDeviceSwitcher();
  });
};

function azTranslateString(value){
  if(state.lang!=='en' || !value) return value;
  let output=String(value);
  Object.entries(AZ_COMPLETE_TRANSLATIONS)
    .sort((a,b)=>b[0].length-a[0].length)
    .forEach(([fr,en])=>{
      output=output.split(fr).join(en);
    });
  return output;
}

function applyCompleteEnglishTranslation(){
  document.documentElement.lang=state.lang;
  if(state.lang!=='en') return;

  const app=document.querySelector('.app');
  if(!app) return;

  const walker=document.createTreeWalker(
    app,
    NodeFilter.SHOW_TEXT,
    {
      acceptNode(node){
        const parent=node.parentElement;
        if(!parent || ['SCRIPT','STYLE'].includes(parent.tagName)) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    }
  );

  const textNodes=[];
  let node;
  while(node=walker.nextNode()) textNodes.push(node);
  textNodes.forEach(n=>{ n.nodeValue=azTranslateString(n.nodeValue); });

  app.querySelectorAll('[placeholder]').forEach(el=>{
    el.setAttribute('placeholder',azTranslateString(el.getAttribute('placeholder')));
  });
  app.querySelectorAll('[title]').forEach(el=>{
    el.setAttribute('title',azTranslateString(el.getAttribute('title')));
  });
  app.querySelectorAll('[aria-label]').forEach(el=>{
    el.setAttribute('aria-label',azTranslateString(el.getAttribute('aria-label')));
  });
}

function v7TranslateString(s){
  if(state.lang!=='en'||!s)return s;
  let out=String(s);
  const dict={...AZ_COMPLETE_TRANSLATIONS,...AZ_V6_TRANSLATIONS,...AZ_V7_TRANSLATIONS};
  Object.entries(dict).sort((a,b)=>b[0].length-a[0].length).forEach(([fr,en])=>{out=out.split(fr).join(en)});
  return out;
}
function v7TranslateAll(){
  if(state.lang!=='en')return;
  const root=document.querySelector('.app');if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;
    return p&&!['SCRIPT','STYLE'].includes(p.tagName)&&n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(x=>x.nodeValue=v7TranslateString(x.nodeValue));
  root.querySelectorAll('option').forEach(o=>o.textContent=v7TranslateString(o.textContent));
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(a=>{if(el.hasAttribute(a))el.setAttribute(a,v7TranslateString(el.getAttribute(a)))});
  });
}

        {icon:'✅',level:'green',title:'Transport conforme',text:'Booking, navire et ETA confirmés.'}
      ],
      recommendations:[
        {id:'insurance',title:'Demander l’attestation',text:'Envoyer une relance automatique au transitaire.',priority:'Moyenne'},
        {id:'customs',title:'Préparer le dossier douane',text:'Le reste des documents est déjà validé.',priority:'Faible'}
      ]
    }
  ]
};

function tradeCopilotText(fr,en){return state.lang==='en'?en:fr}

function getCopilotOperation(){
  return state.tradeCopilot.operations.find(o=>o.ref===state.tradeCopilot.selectedOperation)
    || state.tradeCopilot.operations[0];
}

function selectCopilotOperation(ref){
  state.tradeCopilot.selectedOperation=ref;
  render();
}

function applyCopilotRecommendation(operationRef,recommendationId,title){
  const key=operationRef+'_'+recommendationId;
  state.tradeCopilot.applied[key]=true;
  data.notifications.unshift(
    tradeCopilotText('Trade Copilot : action appliquée — ','Trade Copilot: action applied — ')+title
  );
  render();
  toast(tradeCopilotText('Recommandation appliquée avec succès','Recommendation applied successfully'));
}

function createCopilotTask(operationRef,recommendationId,title){
  const key=operationRef+'_'+recommendationId;
  state.tradeCopilot.applied[key]=true;
  state.tradeCopilot.tasks++;
  if(state.teamTasks){
    state.teamTasks.unshift({
      id:'TC-'+String(Date.now()).slice(-5),
      title,
      team:'Supply Chain',
      owner:'Sami Ben Ali',
      priority:'Haute',
      status:'En attente',
      due:'Aujourd’hui'
    });
  }
  data.notifications.unshift(
    tradeCopilotText('Nouvelle tâche Trade Copilot : ','New Trade Copilot task: ')+title
  );
  render();
  toast(tradeCopilotText('Tâche créée dans le plan opérationnel','Task created in the operational plan'));
}

function runCopilotAnalysis(){
  toast(tradeCopilotText('Analyse des opérations mise à jour','Operations analysis refreshed'));
}

function TradeCopilotPage(){
  const o=getCopilotOperation();
  const highRisks=state.tradeCopilot.operations.filter(x=>x.risk>=60).length;
  const missing=state.tradeCopilot.operations.reduce((s,x)=>s+x.missing.length,0);
  const openRecommendations=state.tradeCopilot.operations.reduce(
    (s,x)=>s+x.recommendations.filter(r=>!state.tradeCopilot.applied[x.ref+'_'+r.id]).length,0
  );

  return `<div class="copilot-hero">
    <div>
      <span class="demo-chip">AZNAVO SIGNATURE MODULE</span>
      <h1>${tradeCopilotText('Trade Copilot','Trade Copilot')}</h1>
      <p>${tradeCopilotText(
        'Votre assistant opérationnel détecte les documents manquants, retards, écarts de coûts et actions prioritaires sur chaque opération.',
        'Your operations assistant detects missing documents, delays, cost variances and priority actions for every shipment.'
      )}</p>
      <div class="panel-actions" style="margin-top:16px">
        <select class="top-select" onchange="selectCopilotOperation(this.value)">
          ${state.tradeCopilot.operations.map(x=>`<option value="${x.ref}" ${x.ref===o.ref?'selected':''}>${x.ref} · ${x.client}</option>`).join('')}
        </select>
        <button class="primary" onclick="runCopilotAnalysis()">✦ ${tradeCopilotText('Actualiser l’analyse','Refresh analysis')}</button>
      </div>
    </div>
    <div class="copilot-orb">✦</div>
  </div>

  <div class="copilot-kpis">
    <div class="card copilot-kpi"><span class="muted">${tradeCopilotText('Opérations analysées','Analyzed operations')}</span><b>${state.tradeCopilot.operations.length}</b><span class="badge violet">COPILOT</span></div>
    <div class="card copilot-kpi"><span class="muted">${tradeCopilotText('Risques élevés','High risks')}</span><b>${highRisks}</b><span class="badge red">${tradeCopilotText('Action requise','Action required')}</span></div>
    <div class="card copilot-kpi"><span class="muted">${tradeCopilotText('Documents manquants','Missing documents')}</span><b>${missing}</b><span class="badge amber">${tradeCopilotText('À compléter','To complete')}</span></div>
    <div class="card copilot-kpi"><span class="muted">${tradeCopilotText('Actions proposées','Suggested actions')}</span><b>${openRecommendations}</b><span class="badge green">${state.tradeCopilot.tasks} ${tradeCopilotText('tâche(s) créée(s)','task(s) created')}</span></div>
  </div>

  <div class="copilot-layout">
    <div>
      <div class="card">
        <div class="section-title"><h3>${tradeCopilotText('Diagnostic de l’opération','Operation diagnostic')}</h3><span class="badge ${o.risk>=60?'amber':'green'}">${tradeCopilotText('Risque','Risk')} ${o.riskLabel}</span></div>
        <div class="copilot-operation">
          <div class="copilot-operation-head">
            <div>
              <h2 style="margin:0 0 7px">${o.ref}</h2>
              <div class="muted">${o.client} · ${o.route}</div>
              <div class="copilot-mini-list">
                <span class="copilot-mini">${tradeCopilotText('Avancement','Completion')} : <b>${o.completion}%</b></span>
                <span class="copilot-mini">ETA : <b>${o.eta}</b></span>
                <span class="copilot-mini">${tradeCopilotText('Documents','Documents')} : <b>${o.missing.length} ${tradeCopilotText('manquant(s)','missing')}</b></span>
              </div>
            </div>
            <div class="copilot-score-ring" style="--score:${o.risk}"><b>${o.risk}</b></div>
          </div>
          <div style="margin-top:17px">
            <div style="display:flex;justify-content:space-between;margin-bottom:7px"><span class="muted">${tradeCopilotText('Complétude du dossier','File completeness')}</span><b>${o.completion}%</b></div>
            <div class="bar"><span style="width:${o.completion}%"></span></div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="section-title"><h3>${tradeCopilotText('Alertes détectées','Detected alerts')}</h3><span class="badge violet">${tradeCopilotText('Analyse métier','Business analysis')}</span></div>
        ${o.alerts.map(a=>`<div class="copilot-alert">
          <div class="copilot-alert-icon">${a.icon}</div>
          <div><b>${tradeCopilotText(a.title,
            a.title==='2 documents manquants'?'2 missing documents':
            a.title==='ETA retardée de 2 jours'?'ETA delayed by 2 days':
            a.title==='Écart devis / facture'?'Quotation / invoice variance':
            a.title==='1 document à compléter'?'1 document to complete':'Transport compliant'
          )}</b><div class="muted" style="margin-top:5px">${a.text}</div></div>
          <span class="badge ${a.level}">${a.level==='red'?tradeCopilotText('Critique','Critical'):a.level==='green'?tradeCopilotText('Conforme','Compliant'):tradeCopilotText('À vérifier','Review')}</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="section-title"><h3>${tradeCopilotText('Plan d’action recommandé','Recommended action plan')}</h3><span class="demo-chip">AI + RULES</span></div>
      <div class="card-pad">
        ${o.recommendations.map(r=>{
          const done=!!state.tradeCopilot.applied[o.ref+'_'+r.id];
          return `<div class="copilot-recommendation ${done?'done':''}">
            <div style="display:flex;justify-content:space-between;gap:10px">
              <h4>${r.title}</h4>
              <span class="badge ${r.priority==='Haute'?'red':r.priority==='Moyenne'?'amber':'blue'}">${r.priority}</span>
            </div>
            <p>${r.text}</p>
            <div class="copilot-actions">
              <button class="secondary" onclick="createCopilotTask('${o.ref}','${r.id}','${r.title.replace(/'/g,"\\'")}')" ${done?'disabled':''}>${done?'✓ '+tradeCopilotText('Créée','Created'):'+ '+tradeCopilotText('Créer une tâche','Create task')}</button>
              <button class="primary ${done?'action-done':''}" onclick="applyCopilotRecommendation('${o.ref}','${r.id}','${r.title.replace(/'/g,"\\'")}')">${done?'✓ '+tradeCopilotText('Appliquée','Applied'):tradeCopilotText('Appliquer','Apply')}</button>
            </div>
          </div>`;
        }).join('')}
        <div class="ai-summary">
          <b>✦ ${tradeCopilotText('Résumé Trade Copilot','Trade Copilot summary')}</b>
          <p>${tradeCopilotText(
            `L’opération ${o.ref} est complétée à ${o.completion} %. Le risque principal concerne les documents et le respect du délai. Les actions prioritaires peuvent être transformées en tâches en un clic.`,
            `Operation ${o.ref} is ${o.completion}% complete. The main risk concerns documents and schedule compliance. Priority actions can be converted into tasks with one click.`
          )}</p>
        </div>
      </div>
    </div>
  </div>`;
}

/* Add the module to the current sidebar without rewriting the existing Sidebar function. */
const __tradeCopilotSidebar=Sidebar;
Sidebar=function(){
  let out=__tradeCopilotSidebar();
  if(!out.includes("nav('tradecopilot')")){
    const button=`<button class="nav-btn ${state.active==='tradecopilot'?'active':''}" onclick="nav('tradecopilot')"><span class="nav-icon">✦</span><span>Trade Copilot</span></button>`;
    const target=`<button class="nav-btn ${state.active==='predictive'?'active':''}" onclick="nav('predictive')">`;
    const idx=out.indexOf(target);
    if(idx>=0) out=out.slice(0,idx)+button+out.slice(idx);
    else out=out.replace('</aside>',button+'</aside>');
  }
  return out;
};

/* Add the new page while preserving every existing page. */
const __tradeCopilotPageContent=pageContent;
pageContent=function(){
  if(state.active==='tradecopilot') return TradeCopilotPage();
  return __tradeCopilotPageContent();
};

/* Add a compact signature card to Dashboard while preserving its current content. */
const __tradeCopilotDashboard=Dashboard;
Dashboard=function(){
  let out=__tradeCopilotDashboard();
  const card=`<div class="card copilot-dashboard-card">
    <div class="copilot-dashboard-grid">
      <div>
        <span class="badge violet">✦ TRADE COPILOT</span>
        <h3 style="margin:10px 0 5px">${tradeCopilotText('Votre priorité aujourd’hui','Your priority today')}</h3>
        <div class="muted">${tradeCopilotText('EXP-2026-001 présente un risque moyen : 2 documents manquants, ETA +2 jours et un écart de coût de 420 TND.','EXP-2026-001 has a medium risk: 2 missing documents, ETA +2 days and a 420 TND cost variance.')}</div>
        <div class="copilot-mini-list">
          <span class="copilot-mini">📄 2 ${tradeCopilotText('documents','documents')}</span>
          <span class="copilot-mini">🚢 ETA +2j</span>
          <span class="copilot-mini">💰 +420 TND</span>
        </div>
      </div>
      <button class="primary" onclick="nav('tradecopilot')">${tradeCopilotText('Ouvrir Trade Copilot','Open Trade Copilot')} →</button>
    </div>
  </div>`;
  const marker='<div class="dashboard-alert-strip">';
  if(out.includes(marker)) return out.replace(marker,card+marker);
  const kpiMarker='<div class="grid kpis">';
  if(out.includes(kpiMarker)) return out.replace(kpiMarker,card+kpiMarker);
  return card+out;
};

render();
</script>
