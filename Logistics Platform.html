argin:20px 0}.login-card-wrap{display:grid;place-items:center;padding:30px}.login-card{width:min(430px,100%);padding:30px}.login-card h2{font-size:26px}.login-card .field{margin-bottom:15px}.login-card button{width:100%;margin-top:8px}.toast{position:fixed;right:25px;bottom:25px;background:#101d33;border:1px solid rgba(59,130,246,.35);padding:14px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:30}.ai-float{position:fixed;right:25px;bottom:25px;width:56px;height:56px;border-radius:17px;border:0;background:linear-gradient(135deg,#7c3aed,#9f67ff);color:#fff;font-size:23px;box-shadow:0 18px 40px rgba(139,92,246,.42)}.hero-map{height:290px;position:relative;background:radial-gradient(circle at 50% 50%,rgba(47,124,255,.09),transparent 55%),linear-gradient(180deg,#071122,#091528)}.route{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#4b90ff,transparent);transform-origin:left center;opacity:.75}.route:after{content:'';position:absolute;right:0;top:-3px;width:8px;height:8px;border-radius:50%;background:#77b1ff;box-shadow:0 0 18px #2f7cff}.empty{padding:50px;text-align:center;color:var(--muted)}@media(max-width:1050px){.kpis,.three,.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.sidebar{width:230px}}@media(max-width:760px){.sidebar{position:fixed;left:-270px;z-index:10}.content{padding:18px}.kpis,.three,.cards,.form-grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-art{display:none}.topbar{padding:0 14px}.page-head{align-items:flex-start;flex-direction:column}}

.profile{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.avatar{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#8b5cf6);font-weight:800}
.full{grid-column:1/-1}.field small{display:block;color:#667b96;margin-top:6px;font-size:11px}
.upload-zone{border:1px dashed rgba(104,165,255,.45);border-radius:14px;padding:22px;text-align:center;background:rgba(47,124,255,.05)}
.upload-zone input{margin-top:12px}.ai-answer{margin-top:14px;padding:14px;border-radius:13px;background:rgba(139,92,246,.09);border:1px solid rgba(139,92,246,.24);line-height:1.6}

.command-layout{display:grid;grid-template-columns:1.45fr .55fr;gap:16px}
.stat-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}

.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filter-row select,.filter-row input{background:#071122;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:#fff}
.timeline{padding:18px}.timeline-step{display:flex;gap:12px;position:relative;padding-bottom:20px}.timeline-step:before{content:'';position:absolute;left:6px;top:14px;bottom:0;width:1px;background:rgba(104,165,255,.28)}.timeline-step:last-child:before{display:none}.timeline-step .dot{flex:0 0 auto}

.auto-fill-box{padding:14px;border-radius:13px;background:rgba(47,124,255,.07);border:1px solid rgba(47,124,255,.25);margin-bottom:15px}
.loading-line{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:12px}
.loading-line span{display:block;height:100%;width:45%;background:linear-gradient(90deg,#2563eb,#8b5cf6);animation:scan 1s infinite alternate}
@keyframes scan{from{transform:translateX(-30%)}to{transform:translateX(160%)}}


.mobile-menu-btn{display:none}
.mobile-overlay{display:none}
.supply-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.supply-kpi{padding:16px}.supply-kpi b{display:block;font-size:23px;margin-top:8px}
.tracking-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.shipment-card{padding:18px}
.shipment-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.shipment-progress{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:22px 0 12px}

.shipment-step.done:before{background:var(--green)}
.shipment-step.current:before{background:var(--amber)}
.shipment-step span{font-size:10px;color:var(--muted)}
.compare-table td.best{background:rgba(34,197,94,.08);color:#9ff0b8;font-weight:700}

.phone-bottom-nav{display:none}

  .topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px;gap:9px}
  .topbar>strong{flex:1;font-size:14px}

  .top-actions{margin-left:0}

  .content{padding:14px}
  .page-head h1{font-size:23px}

  .page-head button,.panel-actions button{flex:1}
  .supply-kpis{grid-template-columns:repeat(2,1fr)}
  .tracking-grid{grid-template-columns:1fr}
  .shipment-progress{grid-template-columns:1fr;gap:8px}
  .shipment-step{text-align:left;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center}
  .shipment-step:before{width:12px;height:12px;margin:0;border-radius:50%}

  .modal-body{padding:15px}.modal-head,.modal-foot{padding:14px}

  .phone-bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;height:64px;background:rgba(5,11,24,.96);border-top:1px solid var(--line);z-index:8;backdrop-filter:blur(18px)}

.customer-hero{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:22px}
.customer-avatar{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#8b5cf6);font-weight:800;font-size:20px}
.customer-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.customer-kpi{padding:16px}.customer-kpi b{display:block;font-size:23px;margin-top:7px}
.customer-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-top:16px}

.email-item:hover,.email-item.active{background:rgba(47,124,255,.07)}

.integration-status{position:absolute;right:16px;top:16px}

.integration-log:last-child{border-bottom:0}

/* Premium icons and motion */
html{scroll-behavior:smooth}
button,.card,.nav-btn,input,select,textarea{
  transition:transform .22s cubic-bezier(.22,.8,.22,1),box-shadow .22s ease,border-color .22s ease,background .22s ease;
}
button:active{transform:scale(.97)}
.primary:hover{transform:translateY(-2px);box-shadow:0 17px 34px rgba(37,99,235,.38)}
.secondary:hover,.icon-btn:hover{transform:translateY(-1px);border-color:rgba(104,165,255,.38);background:rgba(255,255,255,.07)}
.card{animation:cardEnter .48s cubic-bezier(.22,.8,.22,1) both}
.card:hover{transform:translateY(-3px);border-color:rgba(104,165,255,.27);box-shadow:0 26px 72px rgba(0,0,0,.38)}
.content>*{animation:pageEnter .42s cubic-bezier(.22,.8,.22,1) both}
.content>*:nth-child(2){animation-delay:.04s}
.content>*:nth-child(3){animation-delay:.08s}
.content>*:nth-child(4){animation-delay:.12s}
.modal{animation:fadeIn .2s ease both}
.modal-box{animation:modalEnter .3s cubic-bezier(.22,.8,.22,1) both}
.toast{animation:toastEnter .32s cubic-bezier(.22,.8,.22,1) both}
.bar span{transform-origin:left;animation:barEnter .8s cubic-bezier(.22,.8,.22,1) both}
.ai-float{animation:floatButton 2.8s ease-in-out infinite}
.nav-btn{position:relative;overflow:hidden}
.nav-btn:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(104,165,255,.08),transparent);transform:translateX(-120%);transition:transform .5s ease}
.nav-btn:hover:before{transform:translateX(120%)}
.nav-icon{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:8px;background:rgba(47,124,255,.08);color:#8fbdff;font-size:13px}
.nav-btn.active .nav-icon{background:rgba(47,124,255,.22);color:#fff;box-shadow:0 6px 16px rgba(47,124,255,.18)}
.nav-btn.active{box-shadow:inset 3px 0 0 #4f8cff}

/* Animated premium login */
.login{position:relative;overflow:hidden}
.login:before,.login:after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.login:before{width:460px;height:460px;left:-150px;top:-160px;background:radial-gradient(circle,rgba(47,124,255,.25),transparent 68%);animation:orbMove 8s ease-in-out infinite alternate}
.login:after{width:420px;height:420px;right:-120px;bottom:-150px;background:radial-gradient(circle,rgba(139,92,246,.22),transparent 68%);animation:orbMove 10s ease-in-out infinite alternate-reverse}
.login-art,.login-card-wrap{position:relative;z-index:1}
.login-art{animation:loginLeft .65s cubic-bezier(.22,.8,.22,1) both}
.login-card{animation:loginRight .68s cubic-bezier(.22,.8,.22,1) .08s both;background:linear-gradient(180deg,rgba(16,29,51,.95),rgba(8,18,35,.96));backdrop-filter:blur(18px)}
.login-features{display:grid;gap:11px;margin-top:25px}
.login-feature{display:flex;align-items:center;gap:11px;color:#b9c7d8;font-size:14px}
.login-feature span{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:rgba(47,124,255,.12);color:#8ebcff}
.login-demo-note{margin-top:17px;padding:12px;border-radius:12px;background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);color:#9be7b2;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{outline:none;border-color:#4f8cff;box-shadow:0 0 0 4px rgba(47,124,255,.1)}

@keyframes pageEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes cardEnter{from{opacity:0;transform:translateY(15px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalEnter{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastEnter{from{opacity:0;transform:translate(18px,12px)}to{opacity:1;transform:none}}
@keyframes barEnter{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes floatButton{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes orbMove{from{transform:translate3d(0,0,0)}to{transform:translate3d(50px,32px,0)}}
@keyframes loginLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes loginRight{from{opacity:0;transform:translateX(30px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function calculateOrderTotal(){
  const num=id=>{
    const raw=(document.getElementById(id)?.value||'').replace(/\s/g,'').replace(',','.');
    return Number(raw)||0;
  };
  const subtotal=num('f_subtotal');
  const transport=num('f_transport_cost');
  const customs=num('f_customs_cost');
  const insurance=num('f_insurance_cost');
  const other=num('f_other_cost');
  const total=subtotal+transport+customs+insurance+other;
  const currency=document.getElementById('f_order_currency')?.value||'EUR';
  setFieldValue('f_total',total.toLocaleString('fr-FR')+' '+currency);
  const deposit=num('f_deposit_paid');
  setFieldValue('f_remaining',Math.max(total-deposit,0).toLocaleString('fr-FR')+' '+currency);
}
